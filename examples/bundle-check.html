<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EstreUX 변종 번들 검증 — wordchain-story</title>
<!--
  estreuv/pair 변종을 실제 브라우저에서 마운트·동작 확인하는 import-map 하네스.
  estreuv/lit 는 esm.sh 로 해석(버전 핀). estreuv 는 ?external=lit 로 변종과 같은 lit
  인스턴스를 공유한다. 정적 http 서버로 examples/ 를 서빙해 열 것 (file:// 는 ES module
  CORS 로 막힘). agent provider 면 키 없이 폴백으로 동작.

  estreui 변종은 여기서 검증하지 않는다 — EstreUI 는 export 없는 classic-script
  프레임워크(window.estreUi 표면 사용, review #011 / v1.5.1)이고 변종이 EstreUI 페이지
  시스템에 마운트되므로 EstreUI 전체 부팅이 필요해 esm.sh 단일 import 로는 안 된다.
  → 별도 호스트 wordchain-estreui-host.html 에서 검증(2026-05-24: agent 폴백 회전 OK).
  estreuv/pair 검증(2026-05-23): 마운트 + agent 폴백 끝말잇기 회전 OK.
-->
<script type="importmap">
{
  "imports": {
    "estreuv": "https://esm.sh/estreuv@1.0.0?external=lit",
    "lit": "https://esm.sh/lit@3.3.3",
    "lit/": "https://esm.sh/lit@3.3.3/"
  }
}
</script>
<style>
  body { background:#0f1115; color:#e7e9ea; font:14px system-ui,"Noto Sans KR",sans-serif; margin:0; }
  section { height:33vh; min-height:240px; border-bottom:1px solid #2a2f3a; display:flex; flex-direction:column; }
  h2 { margin:6px 12px; font-size:.78rem; color:#9aa3ad; font-weight:600; }
  .host { flex:1; min-height:0; }
</style>
</head>
<body>
  <section><h2>estreuv — &lt;wordchain-story&gt; (custom element)</h2><div class="host"><wordchain-story></wordchain-story></div></section>
  <section><h2>estreui — EstreUI 페이지 마운트 → 별도 호스트 <code>wordchain-estreui-host.html</code></h2><div class="host" style="display:flex;align-items:center;justify-content:center;color:#9aa3ad;font-size:.82rem;text-align:center;padding:0 16px">EstreUI 전체 부팅(window.estreUi 표면)이 필요해 esm.sh import-map 으로는 안 됨.<br />→ wordchain-estreui-host.html 에서 검증</div></section>
  <section><h2>pair — EstreUI 컨테이너가 EstreUV 엘리먼트 호스팅</h2><div id="pair" class="host"></div></section>
<script type="module">
  // 변종별로 격리해 import — 한 변종(esm.sh 패키지 이슈 등)이 실패해도 나머지는 검증.
  window._r = { uv: '…', ui: '…', pair: '…' };
  try { await import('./dist/estreuv/wordchain-story.js'); window._r.uv = 'ok'; }   // customElements.define
  catch (e) { window._r.uv = 'fail: ' + (e && e.message || e); }
  window._r.ui = 'n/a — see wordchain-estreui-host.html';   // estreui = EstreUI 페이지 마운트(별도 호스트)
  try { const m = await import('./dist/pair/wordchain-story.js'); window._pair = m.wordchainStoryPanel(document.getElementById('pair')); window._r.pair = 'ok'; }
  catch (e) { window._r.pair = 'fail: ' + (e && e.message || e); }
  window._done = true;
</script>
</body>
</html>
